title: "Neural Operators for Nonlinear Heat Conduction"
author: Negin Farhadi
# logo: logo.png   # uncomment once you add a logo file

repository:
  url: https://github.com/neural-operators/PINN-FNO-Thermal-Book
  path_to_book: ""
  branch: main

html:
  use_edit_page_button: true
  use_repository_button: true
  use_issues_button: true

# CI installs only jupyter-book and does NOT run the models, so we publish the
# figures already stored in each notebook. Keep this "off" unless the build
# environment also installs jax/optax (see requirements.txt).
execute:
  execute_notebooks: "off"

parse:
  myst_enable_extensions:
    - amsmath      # LaTeX align/equation environments
    - dollarmath   # $...$ and $$...$$ math

# Theme options. Setting html_theme_options here replaces Jupyter Book's defaults
# entirely, so the defaults (repository buttons, search text) are repeated in full.
# show_toc_level: 2 keeps the right sidebar ("Contents") expanded to subsections.
sphinx:
  config:
    html_theme_options:
      show_toc_level: 2
      search_bar_text: "Search this book..."
      path_to_docs: ""
      repository_url: https://github.com/neural-operators/PINN-FNO-Thermal-Book
      repository_branch: main
      home_page_in_toc: true
      use_repository_button: true
      use_edit_page_button: true
      use_issues_button: true

# keep project/helper files out of the published site
exclude_patterns:
  - requirements.txt
  - _build
  - CLAUDE.md
  - checkpoints
  - "**/__pycache__"
  - "**/.ipynb_checkpoints"
